service: content-server-staging
# Custom runtime required for Node.js > v12.19
# See SO question: https://stackoverflow.com/questions/69360628/specifying-node-js-version-for-google-cloud-app-engine-flexible
runtime: custom
env: flex

resources:
  cpu: 1
  memory_gb: 2
  disk_size_gb: 15

automatic_scaling:
  min_num_instances: 1
  max_num_instances: 1

handlers:
- url: /.*
  script: auto
  secure: always
  redirect_http_response_code: 301

env_variables:
  IS_STAGING: "true"
