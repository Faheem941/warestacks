# This configuration runs on app engine standard environment which is cheaper and not much customized option, it doesn't run on docker
# doc ref https://cloud.google.com/appengine/docs/standard/reference/app-yaml?tab=python#instance_class
service: default
runtime: nodejs20
env: standard
instance_class: F1

env_variables:
  NODE_ENV: production
  PORT: 8080

inbound_services:
- warmup

automatic_scaling:
  min_instances: 1
  max_instances: 2
  target_cpu_utilization: 0.75


handlers:
- url: /.*
  script: auto
  secure: always
  redirect_http_response_code: 301